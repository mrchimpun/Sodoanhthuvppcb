<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ doanh thu</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#e1e4e8;--ac:#0f766e;--ac2:#e6f4f2;--rd:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eceff1;--mu:#9aa5b1;--bd:#2f363c;--ac:#2dd4bf;--ac2:#173431;--rd:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#eceff1;--mu:#9aa5b1;--bd:#2f363c;--ac:#2dd4bf;--ac2:#173431;--rd:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}
h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);min-width:0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;background:var(--ac);color:#fff;padding:11px 14px;border-radius:8px;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06201d}
@media (prefers-color-scheme:light){.btn{color:#fff}}
.btn.alt{background:var(--ac2);color:var(--ac)}
.x{background:none;border:0;color:var(--rd);font-size:18px;padding:4px 8px;cursor:pointer;flex:none}
.ed{background:none;border:0;color:var(--ac);padding:4px 8px;cursor:pointer;flex:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--ac2);border-radius:10px;padding:8px 4px}
.sum small{display:block;color:var(--mu);font-size:12px}.sum b{font-size:15px;word-break:break-word}
.item{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.item .m{flex:1;min-width:0;font-size:19px;line-height:1.3}.item .m span{display:block;color:var(--tx);font-size:17px;font-weight:600;margin-top:2px}
.r{text-align:right;white-space:nowrap}
.pos{color:var(--ac)}.neg{color:var(--rd)}
.item.debt{flex-wrap:wrap;padding-top:26px;padding-right:8px;position:relative;background:rgba(245,158,11,.16);box-shadow:inset 5px 0 0 #f59e0b;padding-left:12px;border-radius:8px}.bd{display:inline-block;background:#f59e0b;color:#1b1f24;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}.paid{background:#f59e0b;color:#1b1f24;border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;flex:none}.item .m span.owe{color:#b45309}.dbt{flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;padding-top:8px;border-top:1px dashed rgba(245,158,11,.7)}.dbt small{display:block;font-size:13px;color:var(--mu)}.dbt b{font-size:17px}.dbt .pa{color:var(--ac)}.dbt .ow{color:#b45309;font-size:19px}.cn{position:absolute;top:4px;right:10px;max-width:45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700;color:#b45309}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .item .m span.owe,:root:not([data-theme="light"]) .cn,:root:not([data-theme="light"]) .dbt .ow{color:#fbbf24}}:root[data-theme="dark"] .item .m span.owe,:root[data-theme="dark"] .cn,:root[data-theme="dark"] .dbt .ow{color:#fbbf24}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 4px;color:var(--mu);font-weight:600;cursor:pointer}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
.empty{color:var(--mu);text-align:center;padding:14px 0}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;align-items:center;gap:10px;background:var(--tx);color:var(--bg);padding:10px 12px;border-radius:10px;z-index:60}
#toast span{flex:1;min-width:0}#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px;cursor:pointer}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:30;padding:16px}#dlg .box{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:340px}#dlg p{margin:0 0 4px}
.days{max-height:420px;overflow-y:auto;overscroll-behavior:contain}.days .item{height:60px}
.sw{position:relative;margin-bottom:6px}.sw input{padding-right:40px}.clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mu);font-size:16px;padding:8px 10px;cursor:pointer}
.plist{scroll-margin-top:70px}.plist .item{height:80px;box-sizing:border-box;content-visibility:auto;contain-intrinsic-size:auto 80px}body{touch-action:manipulation}
@media (min-width:900px){body{padding-left:200px;padding-bottom:24px}main{max-width:1080px;padding:20px 28px}h1{font-size:24px}nav{top:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 10px}nav button{flex:none;text-align:left;padding:12px 14px;border-radius:10px;font-size:16px}nav button.on{box-shadow:none;background:var(--ac2)}nav button:hover{background:var(--ac2)}#toast{left:224px;bottom:24px}.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}.plist{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.plist .item:nth-child(2){border-top:0}.bars{height:140px}}
.dt{position:relative;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}.dt span::after{content:" 📅"}
.dd th{position:sticky;top:0;background:var(--card)}
button.dt{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;margin:0}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal .hd button{border:0;background:none;color:inherit;font-size:24px;padding:2px 14px;cursor:pointer}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .g span{color:var(--mu);font-size:12px}.cal .g button{padding:10px 0;border:0;border-radius:8px;background:var(--bg);color:inherit;cursor:pointer;font:inherit}.cal .g button.on{background:var(--ac);color:var(--onac)}.cal .g button.td{outline:1px solid var(--ac)}
:root{--onac:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onac:#06201d}}:root[data-theme="dark"]{--onac:#06201d}
:root:root:root .btn{color:var(--onac)}:root:root:root .btn.alt{color:var(--ac)}
.qb{border:1px solid var(--bd);background:var(--bg);color:inherit;border-radius:6px;width:30px;height:30px;font-size:17px;cursor:pointer;flex:none;padding:0;line-height:1}
#cart input{padding:4px 6px;font-size:15px;border-radius:6px;height:30px}#cart .item{padding:6px 0}#cart .m,#cart .r{font-size:15px}
.pick{max-height:230px;overflow-y:auto;overscroll-behavior:contain}.pk{font-size:17px;display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:6px;cursor:pointer}.pk.on{border-color:var(--ac);background:var(--ac2)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;border-top:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;border-top:0}
.seg{display:flex;gap:8px;margin-bottom:6px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;cursor:pointer}.seg button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px}.bars i{flex:1;background:var(--ac);border-radius:2px 2px 0 0;min-height:2px}.bl{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="dlg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var showN=6,shownFor="",qt,KEY="sodoanhthu_v1",S={products:[],sales:[],expenses:[]},tab="ban",day=today(),rType="month",rDate=today(),eDate=today(),edit=null,mode="load",base=null,q=Promise.resolve(),saveErr=false;
function localGet(){try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.products&&p.sales)return p}}catch(e){}return null}
function localSet(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function push(tag){
 var isE=tag==="x",data=JSON.parse(JSON.stringify(tag==="p"?{items:S.products}:isE?{items:S.expenses}:tag==="s"?{rate:S.rate}:{sales:S.sales.filter(function(s){return s.date.slice(0,7)===tag})}));
 var id=tag==="p"?"products":isE?"fixed":tag==="s"?"settings":"m_"+tag;
 q=q.then(function(){return base.doc(id).set(data)}).then(function(){if(saveErr){saveErr=false;render()}},function(){saveErr=true;render()});
 return q}
function save(tag){if(mode==="cloud")push(tag);else localSet()}
function banner(){if(mode==="local")return'<div class="card" style="border-color:var(--rd)">Chưa đăng nhập claude.ai nên dữ liệu chỉ lưu trên máy này. Hãy mở app khi đã đăng nhập để đồng bộ.</div>';if(saveErr)return'<div class="card" style="border-color:var(--rd)">Chưa lưu được lên máy chủ, vui lòng kiểm tra mạng rồi thao tác lại.</div>';return""}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
function num(s){s=String(s).replace(/\D/g,"");return s===""?NaN:+s}
function vnd(n){return fmt(n)+"đ"}
function fd(s){var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sums(list){var r=0,c=0,t={};list.forEach(function(s){r+=s.price*s.qty;c+=s.cost*s.qty;t[s.tid||s.id]=1});return{rev:r,cost:c,profit:r-c,n:Object.keys(t).length}}
function range(){var d=parse(rDate),a,b;
 if(rType==="week"){var w=(d.getDay()+6)%7;a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-w);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6)}
 else{a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0)}
 return[iso(a),iso(b)]}
function byDay(list){var m={};list.forEach(function(s){(m[s.date]=m[s.date]||[]).push(s)});return Object.keys(m).sort().map(function(k){var t=sums(m[k]);t.date=k;return t})}
function byProd(list){var m={};list.forEach(function(s){var o=m[s.name]=m[s.name]||{name:s.name,qty:0,rev:0,cost:0};o.qty+=s.qty;o.rev+=s.price*s.qty;o.cost+=s.cost*s.qty});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.rev-a.rev})}
function pc(n){return'<b class="'+(n<0?"neg":"pos")+'">'+vnd(n)+'</b>'}

function render(){
 var h="";
 if(mode==="load"){document.getElementById("app").innerHTML='<div class="empty">Đang tải dữ liệu...</div>';return}
 if(tab==="ban")h=vBan();else if(tab==="sp")h=vSp();else if(tab==="kc")h=vKc();else h=vBc();
 document.getElementById("app").innerHTML=h;
 document.getElementById("nav").innerHTML=[["ban","Bán hàng"],["sp","Sản phẩm"],["kc","Khoản chi"],["bc","Báo cáo"]].map(function(t){return'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
}
function vBan(){
 if(!S.products.some(function(p){return p.id===selId}))selId="";
 if(shownFor!==day){shownFor=day;showN=6}
 var list=S.sales.filter(function(s){return s.date===day}),t=sums(list);
 
 var h='<h1>Sổ doanh thu</h1>'+banner()+'<div class="cols"><div><div class="card"><label>Ngày</label><button type="button" class="dt" data-cal="day">'+fd(day)+' 📅</button>'+
 '<div class="sum" style="margin-top:10px"><div><small>Doanh thu</small><b>'+vnd(t.rev)+'</b></div><div><small>Lợi nhuận ('+pct()+'%)</small>'+pc(t.rev*rt())+'</div><div><small>Giao dịch</small><b>'+t.n+'</b></div></div></div>';
 if(!S.products.length)h+='<div class="card empty">Chưa có sản phẩm. Vào tab “Sản phẩm” để thêm trước.</div>';
 else h+='<button class="btn" data-act="openadd">+ Thêm giao dịch</button>';
 h+='</div><div>';
 h+='<div class="card"><h2>Giao dịch ngày '+fd(day)+'</h2>'+(list.length?list.slice().reverse().slice(0,showN).map(function(s){return'<div class="item'+(s.debt?' debt':'')+'"><div class="m">'+esc(s.name)+(s.debt?'<b class="bd">NỢ</b>':'')+'<span>'+s.qty+' × '+vnd(s.price)+'</span></div>'+(s.debt?'':'<div class="r">'+vnd(s.price*s.qty)+'</div>')+(s.debt&&s.cust?'<small class="cn">'+esc(s.cust)+'</small>':'')+'<button class="ed" data-edits="'+s.id+'">Sửa</button><button class="x" data-del="'+s.id+'" aria-label="Xóa">✕</button>'+(s.debt?'<button class="paid" data-paid="'+s.id+'">Thu tiền</button>'+dbt(s):'')+'</div>'}).join("")+(list.length>showN?'<button class="btn alt" data-more="1" style="margin:8px 0 0">Xem thêm ('+(list.length-showN)+' giao dịch)</button>':"")+(showN>6&&list.length>6?'<button class="btn alt" data-less="1" style="margin:8px 0 0">Thu gọn</button>':""):'<div class="empty">Chưa có giao dịch</div>')+'</div></div></div>';
 var td=today(),ms=td.slice(0,8)+"01",ml=S.sales.filter(function(s){return s.date>=ms&&s.date<=td}),mt=sums(ml),days=byDay(ml).reverse();
 h+='<div class="card"><h2>Tổng tháng này: '+fd(ms)+' → '+fd(td)+'</h2><div class="sum"><div><small>Doanh thu</small><b>'+vnd(mt.rev)+'</b></div><div><small>Lợi nhuận ('+pct()+'%)</small>'+pc(mt.rev*rt())+'</div><div><small>Giao dịch</small><b>'+mt.n+'</b></div></div></div>';
 if(days.length)h+='<div class="card"><h2>Tổng theo ngày trong tháng'+(days.length>7?' (trượt xuống để xem thêm)':'')+'</h2><div class="days">'+days.map(function(d){return'<div class="item" data-goto="'+d.date+'" style="cursor:pointer"><div class="m">'+fd(d.date)+'<span>'+d.n+' giao dịch</span></div><div class="r">'+vnd(d.rev)+'<span style="display:block;font-size:13px" class="pos">LN '+vnd(d.rev*rt())+'</span></div></div>'}).join("")+'</div></div>';
 return h;
}
function vSp(){
 var h='<h1>Sản phẩm</h1><button class="btn" data-act="openprod" style="margin:0 0 12px">+ Thêm sản phẩm</button>';
 h+='<div class="card"><h2>Danh sách ('+S.products.length+')</h2>'+(function(){return'<div class="sw"><input id="pq" placeholder="Tìm sản phẩm..." autocomplete="off"><button class="clr" data-clr="pq" aria-label="Xóa chữ">✕</button></div><div id="plist" class="plist">'+plist("")+'</div>'})()+'</div>';
 return h+'<div class="card"><h2>Nhập sản phẩm từ Excel</h2><p style="margin:0;color:var(--mu);font-size:14px">File .xlsx, .xls hoặc .csv, các cột theo thứ tự: Tên, Giá bán, Giá gốc (dòng đầu là tiêu đề).</p><input type="file" id="xf" accept=".xlsx,.xls,.csv" style="margin-top:8px"><button class="btn alt" data-act="tpl">Tải file mẫu (CSV)</button></div><div class="card"><h2>Sao lưu dữ liệu</h2><button class="btn alt" data-act="backup">Tải bản sao lưu (.json)</button><label>Khôi phục từ bản sao lưu (gộp vào dữ liệu hiện có, không xóa gì)</label><input type="file" id="rf" accept=".json,application/json"></div>';
}
function vKc(){var et=0;S.expenses.forEach(function(e){et+=e.amount});
 return'<h1>Khoản chi</h1><div class="card"><h2>Phí cố định mỗi tháng</h2><div class="row"><div><label>Tên khoản chi</label><input id="en" placeholder="VD: Tiền điện" autocomplete="off"></div><div><label>Giá</label><input id="ea" class="money" inputmode="numeric" placeholder="0"></div></div><button class="btn" data-act="addexp">Thêm khoản chi</button></div><div class="card"><div class="tbl"><table><tr><th>Tên khoản chi</th><th>Giá</th><th></th></tr>'+S.expenses.map(function(e){return'<tr><td style="white-space:normal">'+esc(e.name)+'</td><td>'+vnd(e.amount)+'</td><td><button class="ed" data-exe="'+e.id+'">Sửa</button><button class="x" data-dele="'+e.id+'" aria-label="Xóa">✕</button></td></tr>'}).join("")+'<tr><td><b>Tổng chi mỗi tháng</b></td><td><b>'+vnd(et)+'</b></td><td></td></tr></table></div></div>'}
function vBc(){
 var r=range(),list=S.sales.filter(function(s){return s.date>=r[0]&&s.date<=r[1]}),t=sums(list),dd=byDay(list),pp=byProd(list),ex=S.expenses,et=0;ex.forEach(function(e){et+=e.amount});
 var h='<h1>Báo cáo</h1><div class="card"><label>Chọn một ngày trong '+(rType==="week"?"tuần":"tháng")+' cần xem</label><div style="display:flex;gap:6px"><button class="btn alt" data-rnav="-1" style="width:auto;margin:0;padding:10px 16px" aria-label="Kỳ trước">‹</button><button type="button" class="dt" data-cal="rd" style="flex:1">'+fd(rDate)+' 📅</button><button class="btn alt" data-rnav="1" style="width:auto;margin:0;padding:10px 16px" aria-label="Kỳ sau">›</button></div><p style="margin:10px 0 0;color:var(--mu)">'+fd(r[0])+' → '+fd(r[1])+'</p>'+
 '<label>Tỉ lệ lợi nhuận (%)</label><input id="rate" inputmode="decimal" value="'+pct()+'" style="max-width:140px"><div class="sum" style="margin-top:10px;grid-template-columns:repeat(2,1fr)"><div><small>Doanh thu</small><b>'+vnd(t.rev)+'</b></div><div><small>'+"Lợi nhuận ("+pct()+"%)"+'</small>'+pc(t.rev*rt()-et)+'</div></div><button class="btn" data-act="export">Xuất file báo cáo (CSV)</button></div>';
 h+='<div class="card"><h2>Doanh thu theo ngày</h2>'+(dd.length?bars(r,dd):'<div class="empty">Không có dữ liệu</div>')+'</div>';
 if(dFor!==rDate){dFor=rDate;dN=7}
 h+='<div class="card"><h2>Theo ngày</h2>'+(dd.length?'<div class="tbl dd"><table><tr><th>Ngày</th><th>GD</th><th>Doanh thu</th><th>Lợi nhuận</th></tr>'+dd.slice().reverse().slice(0,dN).map(function(d){return'<tr><td>'+fd(d.date)+'</td><td>'+d.n+'</td><td>'+vnd(d.rev)+'</td><td>'+vnd(d.rev*rt())+'</td></tr>'}).join("")+'</table></div>'+(dd.length>dN?'<button class="btn alt" data-dmore="1" style="margin:8px 0 0">Xem thêm ('+(dd.length-dN)+' ngày)</button>':"")+(dN>7&&dd.length>7?'<button class="btn alt" data-dless="1" style="margin:8px 0 0">Thu gọn</button>':"")+'':'<div class="empty">Không có dữ liệu</div>')+'</div>';

  var er=document.getElementById("adderr"),items=addD.items.filter(function(x){return x.qty>0});
  if(!items.length){er.textContent="Hãy chạm vào sản phẩm để thêm vào giao dịch.";return}
  var tid=uid(),mk=addD.date.slice(0,7),tot=0,lines=items.map(function(x){tot+=Math.round(x.price*x.qty);return{id:uid(),tid:tid,date:addD.date,pid:x.pid,name:x.name,qty:x.qty,price:x.price,cost:x.cost}});
  if(addD.d){var pd=num(addD.dp)||0,cn=String(addD.c).trim();if(pd<tot){if(!cn){er.textContent="Nhập tên khách nợ.";return}lines.forEach(function(ln){var t=Math.round(ln.price*ln.qty),pp=Math.min(pd,t);pd-=pp;if(pp<t){ln.debt=true;ln.cust=cn;if(pp>0)ln.paid=pp}})}}
  lines.forEach(function(ln){S.sales.push(ln)});save(mk);day=addD.date;hideAsk();render();
  showUndo("✓ Đã thêm giao dịch: "+(lines.length>1?lines.length+" sản phẩm":lines[0].name+" × "+lines[0].qty)+" = "+vnd(tot),function(){S.sales=S.sales.filter(function(s){return s.tid!==tid});save(mk);render()})}
 if(a==="saveprod"){
  var n=document.getElementById("pn").value.trim(),pr=num(document.getElementById("pp").value),co=num(document.getElementById("pc").value)||0;
  if(!n||!(pr>=0)||isNaN(pr)){document.getElementById("perr").textContent="Nhập tên và giá bán.";return}
  var nk=n.toLowerCase().replace(/\s+/g," ");
  if(S.products.some(function(x){return x.id!==edit&&x.name.trim().toLowerCase().replace(/\s+/g," ")===nk&&x.price===pr})){document.getElementById("perr").textContent="Sản phẩm “"+n+"” với giá bán "+vnd(pr)+" đã có trong danh sách.";return}
  var wasEdit=!!edit;if(edit){S.products.forEach(function(x){if(x.id===edit){x.name=n;x.price=pr;x.cost=co}});edit=null}
  else{var np={id:uid(),name:n,price:pr,cost:co};S.products.push(np);selId=np.id}
  hideAsk();
  save("p");render();showMsg(wasEdit?"✓ Đã cập nhật sản phẩm "+n:"✓ Đã thêm sản phẩm "+n)}
 if(a==="saveexp"){var xn=document.getElementById("xn").value.trim(),xa=num(document.getElementById("xa").value);if(!xn||isNaN(xa)){document.getElementById("xerr").textContent="Nhập tên khoản chi và giá.";return}S.expenses.forEach(function(x){if(x.id===expId){x.name=xn;x.amount=xa}});save("x");hideAsk();render();showMsg("✓ Đã cập nhật khoản chi "+xn);return}
 if(a==="openprod"){edit=null;showProd();return}
 if(a==="openadd"){addD={date:day,qty:"1",g:"",q:"",d:false,dp:"",c:"",items:[]};showAdd();return}
 if(a==="addexp"){var en=document.getElementById("en").value.trim(),ea=num(document.getElementById("ea").value);
  if(!en||isNaN(ea)){note("Nhập tên khoản chi và giá.");return}
  S.expenses.push({id:uid(),name:en,amount:ea});save("x");render()}
 if(a==="tpl")dl("mau-san-pham.csv",csvRows([["Tên","Giá bán","Giá gốc"],["Cà phê sữa",25000,12000]]),"text/csv");
 if(a==="backup")dl("sao-luu-so-doanh-thu.json",JSON.stringify(S),"application/json");
 if(a==="export"){
  var r=range(),list=S.sales.filter(function(s){return s.date>=r[0]&&s.date<=r[1]}),t=sums(list);
  var rows=[["Báo cáo "+(rType==="week"?"tuần":"tháng"),fd(r[0])+" - "+fd(r[1])],[],["Ngày","Số giao dịch","Doanh thu","Giá vốn","Lợi nhuận"]];
  byDay(list).forEach(function(d){rows.push([fd(d.date),d.n,d.rev,d.cost,Math.round(d.rev*rt())])});
  rows.push(["Tổng",t.n,t.rev,t.cost,Math.round(t.rev*rt())],[],["Sản phẩm","Số lượng","Doanh thu","Giá vốn","Lợi nhuận"]);
  byProd(list).forEach(function(p){rows.push([p.name,p.qty,p.rev,p.cost,Math.round(p.rev*rt())])});
  var xe=S.expenses,xt=0;rows.push([],["Khoản chi cố định mỗi tháng"],["Tên khoản chi","Giá"]);xe.forEach(function(e){xt+=e.amount;rows.push([e.name,e.amount])});rows.push(["Tổng chi mỗi tháng",xt]);
  rows.push([],["Chi tiết giao dịch"],["Ngày","Sản phẩm","Số lượng","Giá bán","Giá gốc","Thành tiền"]);
  list.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(s){rows.push([fd(s.date),s.name,s.qty,s.price,s.cost,s.price*s.qty])});
  dl("bao-cao-"+(rType==="week"?"tuan":"thang")+"-"+r[0]+".csv",csvRows(rows),"text/csv");
 }
}
document.addEventListener("input",function(ev){var t=ev.target;if(t.classList&&t.classList.contains("money")){var d=t.value.replace(/\D/g,"");t.value=d?Number(d).toLocaleString("en-US"):""}});
document.addEventListener("input",function(ev){var t=ev.target;
 if(t.id==="pq"||t.id==="sq"){if(t.id==="pq")pN=15;clearTimeout(qt);qt=setTimeout(function(){var el=document.getElementById(t.id==="pq"?"plist":"sres");if(el)el.innerHTML=(t.id==="pq"?plist:pickHtml)(t.value)},90)}
});
document.addEventListener("input",function(ev){var t=ev.target;if(t.classList&&(t.classList.contains("cq")||t.classList.contains("cp"))){var x=addD.items[+t.dataset.i];if(!x)return;if(t.classList.contains("cq"))x.qty=parseFloat(t.value)||0;else x.price=num(t.value)||0;var tot=0;addD.items.forEach(function(y,k){tot+=y.price*y.qty;var e=document.getElementById("lt"+k);if(e)e.textContent=vnd(y.price*y.qty)});var ct=document.getElementById("ct");if(ct)ct.textContent=vnd(tot)}});
document.addEventListener("change",function(ev){
 if(ev.target.id==="ed"&&ev.target.value){eDate=ev.target.value;ev.target.previousElementSibling.textContent=fd(eDate);return}
 if(ev.target.id==="rate"){var rv=parseFloat(String(ev.target.value).replace(",","."));if(!(rv>=0&&rv<=100)){note("Nhập tỉ lệ từ 0 đến 100.");render();return}S.rate=rv;save("s");render();return}
 if(ev.target.id==="xf"){importXls(ev.target);return}
 if(ev.target.id==="rf"){importBak(ev.target);return}
 if(ev.target.id==="debt"||ev.target.id==="edebt"){document.getElementById(ev.target.id+"box").style.display=ev.target.checked?"block":"none";return}
 if(ev.target.id==="day"&&ev.target.value){day=ev.target.value;render()}
 if(ev.target.id==="rd"&&ev.target.value){rDate=ev.target.value;render()}
});
async function init(){
 render();
 try{
  var db=await claude.use("db"),us=await claude.use("user"),uid=us?await us.id():null;
  if(db&&uid){
   base=db.collection("data/users/"+uid);
   var snap=await base.get(),has=false,fx=null,ol=[];
   S={products:[],sales:[],expenses:[]};
   snap.docs.forEach(function(d){if(!d.exists)return;has=true;var x=JSON.parse(JSON.stringify(d.data()||{}));if(d.id==="products")S.products=x.items||[];else if(d.id.indexOf("m_")===0)S.sales=S.sales.concat(x.sales||[]);else if(d.id==="settings"){if(typeof x.rate==="number")S.rate=x.rate}else if(d.id==="fixed")fx=x.items||[];else if(d.id.indexOf("e_")===0)ol=ol.concat(x.items||[])});
   if(fx)S.expenses=fx;else if(ol.length){S.expenses=ol;push("x")}
   mode="cloud";
   if(!has){var L=localGet();if(L&&(L.products.length||L.sales.length)){S=L;push("p");var ms={};L.sales.forEach(function(s){ms[s.date.slice(0,7)]=1});Object.keys(ms).forEach(function(k){push(k)});q.then(function(){if(!saveErr)say("Đã chuyển dữ liệu từ máy này lên tài khoản của bạn.")})}}
  }else{mode="local";var L2=localGet();if(L2)S=L2}
 }catch(e){mode="local";var L3=localGet();if(L3)S=L3}
 if(!S.expenses)S.expenses=[];
 if(typeof S.rate!=="number")S.rate=35;
 render();
}
init();
})();
</script>
